<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZELLOOTEC</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      background: #ffffff;
      overflow: hidden;
      position: relative;
    }
    .stage {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1280px;
      height: 800px;
      transform: translate(-50%, -50%);
      transform-origin: center center;
      display: grid;
      place-items: center;
      background: #ffffff;
    }
    img {
      width: 720px;
      max-width: 70%;
      height: auto;
      object-fit: contain;
      -webkit-user-drag: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <img src="img/zellootec.jpg" alt="ZELLOOTEC" />
  </div>
  <script>
    (function () {
      var W = 1280, H = 800;
      function fit() {
        var s = Math.min(window.innerWidth / W, window.innerHeight / H);
        document.getElementById("stage").style.transform =
          "translate(-50%, -50%) scale(" + s + ")";
      }
      fit();
      window.addEventListener("resize", fit);
    })();
  </script>
</body>
</html>
